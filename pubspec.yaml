name: paywave
description: "A new Flutter project."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.5.4


dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.2   
  flutter_screenutil: ^5.9.0
  flutter_dotenv: ^5.2.1
  get: ^4.6.6
  http: 1.6.0
  iconsax: ^0.0.8
  image_picker: ^1.1.2
  intl: ^0.19.0
  provider: ^6.1.2
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0
  supabase_flutter: ^2.9.1
  permission_handler: ^12.0.1
  flutter_secure_storage: ^9.2.4
  web3dart: ^2.6.1
  flutter_riverpod: ^3.1.0 
  uuid: 3.0.7
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  mobile_scanner: ^7.2.0
  palette_generator: ^0.3.3+7
  cached_network_image: ^3.3.1
  dio: ^5.9.2
  qr_flutter: ^4.1.0



dev_dependencies:
  build_runner: ^2.4.9
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logos/Klipa_logo.png"
  adaptive_icon_foreground:  "assets/logos/Klipa_logo_foreground.png"
  adaptive_icon_background:  "#ffffff"
flutter:

  uses-material-design: true

  assets:
    - .env.development
    - .env.production
    - .env.staging
    - assets/images/   
    - assets/images/profile/
    - assets/logos/
    - assets/logos/crypto/
    - assets/images/login/
    - assets/images/login/info.svg
    - assets/images/crypto/
    - assets/images/crypto/news/
    - assets/images/on_boarding_images/
